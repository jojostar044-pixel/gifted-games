<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ألعاب العباقرة – اختبارات الموهوبين</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  body{margin:0;font-family:'Baloo Bhaijaan 2',system-ui,sans-serif;color:#2b2140;min-height:100vh;
    background:radial-gradient(circle at 15% 10%,#ffe7f2 0,transparent 35%),radial-gradient(circle at 85% 20%,#e3f0ff 0,transparent 35%),radial-gradient(circle at 50% 100%,#e8f8e6 0,transparent 45%),#fff8ef}
  .wrap{max-width:760px;margin:0 auto;padding:32px 16px;text-align:center}
  h1{font-size:40px;margin:8px 0 4px}
  p{font-size:19px;color:#6b6280;margin:0 0 24px}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  a.card{display:block;text-decoration:none;color:inherit;background:#fff;border-radius:28px;padding:24px 18px;border:4px solid;box-shadow:0 6px 0 rgba(0,0,0,.07);transition:transform .15s}
  a.card:hover{transform:translateY(-4px)}
  .emoji{font-size:56px}
  .t{font-size:26px;font-weight:800;margin:6px 0}
  .s{font-size:17px;color:#6b6280}
  .go{display:inline-block;margin-top:12px;color:#fff;font-weight:800;font-size:20px;border-radius:999px;padding:8px 26px}
  @media (max-width:560px){.cards{grid-template-columns:1fr}h1{font-size:30px}}
</style>
</head>
<body>
<div class="wrap">
  <div style="font-size:48px">🐱🌸⭐🌸🐱</div>
  <h1>ألعاب العباقرة</h1>
  <p>اختر مستواك وابدأ الرحلة!</p>
  <div class="cards">
    <a class="card" href="level1.html" style="border-color:#3b82f6">
      <div class="emoji">🌟</div>
      <div class="t">المستوى الأول</div>
      <div class="s">رحلة العباقرة الصغار<br>21 سؤالًا + محطة إبداع</div>
      <span class="go" style="background:#3b82f6">العب الآن</span>
    </a>
    <a class="card" href="level2.html" style="border-color:#ea580c">
      <div class="emoji">🚀</div>
      <div class="t">المستوى الثاني</div>
      <div class="s">لأعمار 11 إلى 13 سنة<br>25 سؤالًا + محطة إبداع</div>
      <span class="go" style="background:#ea580c">العب الآن</span>
    </a>
  </div>
</div>
</body>
</html>
